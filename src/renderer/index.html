<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>剑星 Mod 管理器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <aside class="side">
    <div class="brand">
      <div class="logo">SB</div>
      <div class="brand-text">
        <h1>剑星 Mod 管理器</h1>
        <p id="verLine">Stellar Blade</p>
      </div>
      <!-- 2026-11-24：侧栏折叠开关。折叠后只留图标，给列表让出可视区；状态存 localStorage。 -->
      <button class="side-toggle" id="btnSideToggle" title="折叠侧栏" aria-label="折叠侧栏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>
    <nav>
      <!-- 2026-11-10 用户定案：把「已安装 Mod」并进「Mod 库」，左侧只留一个入口。
           在线 / 已下载 / 已安装 都在同一页，用顶部状态筛选区分。 -->
      <div class="nav-i on" data-p="p-browse" title="Mod 库">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 3 2.5 15 0 18M12 3c-2.5 3-2.5 15 0 18"/></svg>
        <span class="nav-text">Mod 库</span> <span class="badge" id="navCountInstalled">0</span>
      </div>
      <div class="nav-i" data-p="p-download" title="下载">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>
        <span class="nav-text">下载</span> <span class="badge" id="navCountDownload">0</span>
      </div>
      <div class="nav-i" data-p="p-prereq" title="前置组件">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/><path d="M9 12l2 2 4-4"/></svg>
        <span class="nav-text">前置组件</span>
      </div>
      <div class="nav-i" data-p="p-crash" title="崩溃诊断">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l9 4v5c0 5-3.8 8.6-9 9-5.2-.4-9-4-9-9V7z"/><path d="M12 8v5"/><path d="M12 16.5v.01"/></svg>
        <span class="nav-text">崩溃诊断</span> <span class="badge warn" id="navCountCrash" style="display:none">0</span>
      </div>
      <div class="nav-i" data-p="p-settings" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-2.9 1.2V21a2 2 0 11-4 0v-.1A1.7 1.7 0 006 19.4l-.1.1a2 2 0 11-2.8-2.8l.1-.1A1.7 1.7 0 003 13.7a2 2 0 110-4h.1A1.7 1.7 0 004.6 6L4.5 6a2 2 0 112.8-2.8l.1.1A1.7 1.7 0 0010.3 3a2 2 0 114 0v.1a1.7 1.7 0 002.9 1.2l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 001.2 2.9H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
        <span class="nav-text">设置</span>
      </div>
    </nav>
    <div class="side-foot">
      <div class="gamestat"><i class="dot" id="gameDot"></i><span id="gameStat">正在检测游戏…</span></div>
      <div class="path" id="gamePath">—</div>
    </div>
  </aside>

  <div class="main">
    <div class="top">
      <h2 id="ttl">Mod 库</h2>
      <span class="sub" id="sub"></span>
      <div class="spacer"></div>
      <div class="search" id="searchBox" style="display:none">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="searchInput" placeholder="搜索 Mod 名称，回车确认">
      </div>
      <button class="btn" id="btnLaunch" title="直接启动游戏（不走 Steam，绿色版 / Steam / Epic 都行）">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        启动游戏
      </button>
      <button class="btn" id="btnOpenSite" title="在浏览器里打开 Nexus 的星刃 Mod 列表（想看评论、更新日志就去网页）" style="display:none">Nexus官网</button>
      <button class="btn" id="btnRefresh">刷新</button>
      <button class="btn" id="btnNexusAccount">Nexus 账号</button>
      <button class="btn p" id="btnImport" title="把下载好的压缩包（.7z / .zip / .rar）导入管理器，之后可以一键装进游戏"><i class="plus" aria-hidden="true">＋</i> 导入</button>
    </div>

    <div class="body" id="body">

      <!-- 已安装 -->
      <!-- 2026-11-11：#p-installed 只是 renderInstalled() 的数据容器（留着它，state.installedGroups 才有来源），
     不能再带 .on —— 否则首屏显示的是这个老页面，点一下导航才变成 Mod 库。 -->
    <div class="page" id="p-installed">
        <div id="installedArea"></div>
      </div>

      <!-- 浏览 -->
      <div class="page on" id="p-browse">
        <!-- 吸顶区：排序 / 范围 / 筛选 / 统计 —— 滚动时不消失（用户 2026-10-13 要求） -->
        <div class="bhead" id="browseHead">
          <!-- 顶部按「问题的性质」分四段（2026-11-23 改版）：
               每段左侧一条 40px 标签列，所有行第一颗 chip 从同一 x 起排；
               状态=磁盘说了算、标记=自己打的、分类=信息范围、排序/操作=动作。 -->
          <div class="sect">
            <span class="slabel">状态</span>
            <div class="sbody"><div class="sline"><div class="tabs libst" id="libStatus"></div><button class="btn sm fclear" id="btnClearFilter" style="display:none" title="清掉当前分类/标签筛选">清除筛选</button></div></div>
          </div>
          <div class="sect">
            <span class="slabel">标记</span>
            <div class="sbody"><div class="sline"><div class="tabs libmarks" id="libMarks"
              title="点一下切三态：任意 → 排除 → 只看（正面标记反过来：任意 → 只看 → 排除）"></div></div></div>
          </div>
          <div class="sect">
            <span class="slabel">分类</span>
            <div class="sbody"><div class="sline">
              <!-- 分类 chips（合并态由 renderLibFilters() 把成人三档画在同一行） -->
              <div class="filters" id="browseFilters"></div>
              <!-- 在线档位用的成人三档（合并态隐藏） -->
              <div class="tabs adult" id="adultTabs" title="成人内容显示范围">
                <button data-adult="hide" title="不显示成人内容（露骨的单独藏起来）">隐藏成人</button>
                <button data-adult="all" class="on" title="成人内容也照常显示">全部内容</button>
                <button data-adult="only" title="只列出成人内容">只看成人</button>
              </div>
            </div></div>
          </div>
          <div class="sect">
            <span class="slabel">排序</span>
            <div class="sbody"><div class="sline">
              <div class="tabs" id="sortTabs">
                <button data-sort="downloads" class="on">下载最多</button>
                <button data-sort="endorsements">最多点赞</button>
                <button data-sort="newest">最新发布</button>
                <button data-sort="updated">最近更新</button>
              </div>
              <!-- 本地维度只留一颗（方向统一交给右边的 ↓/↑，不再一个维度摆两颗）——2026-11-23 用户要求 -->
              <div class="tabs localsort" id="libSortTabs" title="本地记录的排序方式（「开启时间 / 禁用时间」用来排查新开关的 Mod）">
                <button data-libsort="on">开启时间</button>
                <button data-libsort="off">禁用时间</button>
                <button data-libsort="inst">安装时间</button>
                <button data-libsort="name">名称</button>
              </div>
            </div></div>
          </div>
          <!-- 操作行：只在多选态出现（非多选不占高度，2026-11-23 用户要求） -->
          <div class="sect" id="opSect" style="display:none">
            <span class="slabel">操作</span>
            <div class="sbody"><div class="sline">
              <!-- 「多选/完成」开关固定在操作行开头（0.9.3 用户要求：跟筛选按钮一样靠左对齐）。 -->
              <button class="btn sm" id="btnBatchMode" title="勾选多个 Mod，批量下载 / 安装 / 启用 / 卸载">多选</button>
              <div class="tabs batch" id="batchBar" title="多选模式：勾选多个 Mod，按它们当前的状态批量下载 / 安装 / 启用 / 卸载">
                <button id="btnSelectAll" style="display:none">全选</button>
                <button id="btnBatchDownload" class="bdl" style="display:none" title="把选中的在线 Mod 全部加入下载队列">批量下载</button>
                <button id="btnBatchInstall" class="bdl" style="display:none" title="把选中的已下载安装包全部装进游戏">批量安装</button>
                <button id="btnBatchOn" class="bdl" style="display:none" title="把选中的 Mod 全部打开（游戏就会加载它们）">批量启用</button>
                <button id="btnBatchOff" class="bdl" style="display:none" title="把选中的 Mod 全部关掉（文件留在原地，游戏不加载）">批量禁用</button>
                <button id="btnBatchUninstall" class="bdl" style="display:none" title="把选中的 Mod 从游戏目录里删掉（安装包和你的标记都保留）">批量卸载</button>
              </div>
              <div class="tabs batch marks" id="batchMarks" style="display:none" title="多选模式：给选中的 Mod 批量打标记">
                <button id="btnBatchLike">👍 喜欢</button>
                <button id="btnBatchDislike">👎 不喜欢</button>
                <button id="btnBatchBug" class="tone-bad">⚠ 有 bug</button>
                <button id="btnBatchVerify" class="tone-ver">✓ 已验证</button>
                <button id="btnBatchUnverify" class="tone-dim">未验证</button>
              </div>
              <button class="btn sm" id="btnLoadMore" style="display:none">加载更多</button>
            </div></div>
          </div>
          <div class="statsrow">
            <div class="stats" id="browseStats"></div>
          </div>

        </div>
        <div id="browseArea"></div>
      </div>

      <!-- 下载管理 -->
      <div class="page" id="p-download">
        <div id="downloadArea"></div>
      </div>

      <!-- 前置组件 -->
      <div class="page" id="p-prereq">
        <div id="prereqArea"></div>
      </div>

      <!-- 崩溃诊断：读 UE4SS.log + 引擎崩溃快照，判断哪个 Mod 让游戏崩了 -->
      <div class="page" id="p-crash">
        <div id="crashArea"></div>
      </div>

      <!-- 设置 -->
      <div class="page" id="p-settings">
        <div id="settingsArea"></div>
      </div>
    </div>
  </div>
</div>

<div class="dmask" id="drawerMask" title="点这里关闭"></div>
<div class="drawer" id="drawer">
  <div class="dh">
    <div style="min-width:0;flex:1">
      <h3 id="dTitle">—</h3>
      <div class="sub" id="dSub"></div>
    </div>
    <button class="x" id="dClose">✕</button>
  </div>
  <div class="dbody" id="dBody"></div>
  <div class="dfoot" id="dFoot"></div>
</div>

<div class="modal" id="modal">
  <div class="mbox">
    <h3 id="mTitle">—</h3>
    <div class="mbody" id="mBody"></div>
    <div class="mfoot" id="mFoot"></div>
  </div>
</div>

<div id="toast"></div>

<!-- ---------------- 多语言 ----------------
     顺序不能动：
       1. i18n.js       先建好 window.I18N 与查表函数
       2. locales/*.js  各语言包往里 register（缺一个就在那个语言下退回中文）
       3. app.js        业务代码，启动时会 observe 整个界面做翻译
     简体中文没有语言包 —— 界面原文就是简体中文，lookup() 直接原样返回。
     全部走 <script> 是因为界面 CSP 是 `script-src 'self'`，
     file:// 下 fetch 也读不了本地 json。 -->
<script src="i18n.js"></script>
<script src="locales/zh-TW.js"></script>
<script src="locales/en-US.js"></script>
<script src="locales/ja-JP.js"></script>
<script src="locales/ko-KR.js"></script>
<script src="locales/ru-RU.js"></script>
<script src="locales/de-DE.js"></script>
<script src="locales/fr-FR.js"></script>
<script src="locales/es-ES.js"></script>
<script src="locales/pt-BR.js"></script>
<script src="locales/it-IT.js"></script>
<script src="locales/pl-PL.js"></script>
<script src="locales/tr-TR.js"></script>
<script src="locales/th-TH.js"></script>
<script src="app.js"></script>
</body>
</html>
